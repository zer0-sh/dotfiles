name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks scan
        id: scan
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -O gitleaks.tar.gz
          tar xzf gitleaks.tar.gz
          chmod +x gitleaks
          ./gitleaks detect -s . --no-git --redact=0 || true

      - name: Check results
        run: |
          if grep -q "Finding" gitleaks-report.json 2>/dev/null; then
            echo "::warning::⚠️ SECRETS DETECTED!"
            exit 1
          fi
          echo "✅ No secrets detected"