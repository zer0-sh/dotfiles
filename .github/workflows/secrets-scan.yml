name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks scan
        id: scan
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -O gitleaks.tar.gz
          tar xzf gitleaks.tar.gz
          chmod +x gitleaks
          ./gitleaks detect -s . --no-git --report-path gitleaks-report.json || true
          
          # Check if report has actual findings (not empty)
          if [ -s gitleaks-report.json ] && [ "$(wc -c < gitleaks-report.json)" -gt 10 ]; then
            echo "secrets_found=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Display summary
        if: success()
        run: |
          if [[ "${{ steps.scan.outputs.secrets_found }}" == "true" ]]; then
            echo "::warning::⚠️ SECRETS DETECTED! Commit contains secrets."
            cat gitleaks-report.json
            exit 1
          else
            echo "✅ No secrets detected in this commit"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7