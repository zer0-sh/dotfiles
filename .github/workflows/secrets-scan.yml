name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks scan
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -O gitleaks.tar.gz
          tar xzf gitleaks.tar.gz
          chmod +x gitleaks
          ./gitleaks detect -s . --no-git --verbose --report-path gitleaks-report.json || true
          cat gitleaks-report.json || echo "No secrets found"

      - name: Check for secrets
        run: |
          if [ -s gitleaks-report.json ] && [ "$(cat gitleaks-report.json | grep -c Finding)" -gt 0 ]; then
            echo "SECRETS DETECTED!"
            cat gitleaks-report.json
            exit 1
          fi
          echo "No secrets found"